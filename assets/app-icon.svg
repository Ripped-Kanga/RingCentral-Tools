<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#0D1A2E"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA733"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- subtle 'ring' motif -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FF8800" stroke-opacity="0.12" stroke-width="18"/>

  <!-- classic handset glyph (Material Design 'call', Apache 2.0) -->
  <g transform="translate(92 132) scale(12)">
    <path fill="url(#phone)" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
  </g>

  <!-- signal / status arcs radiating into the handset's concave side -->
  <path d="M 330 174 a 56 56 0 0 1 56 56" fill="none" stroke="#E8EEF7"
        stroke-opacity="0.95" stroke-width="22" stroke-linecap="round"/>
  <path d="M 330 120 a 110 110 0 0 1 110 110" fill="none" stroke="#E8EEF7"
        stroke-opacity="0.5" stroke-width="22" stroke-linecap="round"/>
</svg>
